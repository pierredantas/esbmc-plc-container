name: probe

# Run one command inside the pinned image, on Linux, and keep its output.
on:
  workflow_dispatch:
    inputs:
      image:
        description: "image reference, by digest"
        required: true
      cmd:
        description: "bash command to run in the image"
        required: true

permissions:
  contents: read
  packages: read

jobs:
  run:
    runs-on: ubuntu-24.04
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Run
        env:
          IMAGE: ${{ inputs.image }}
          CMD: ${{ inputs.cmd }}
        run: docker run --rm "$IMAGE" bash -c "$CMD" 2>&1 | tee probe.txt
      - uses: actions/upload-artifact@v4
        with:
          name: probe
          path: probe.txt
